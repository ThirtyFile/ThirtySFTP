[package]
name = "thirtysftp-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# Not part of the main workspace: it needs a nightly toolchain and cargo-fuzz.
#
#   cargo install cargo-fuzz
#   cargo +nightly fuzz run decode
#   cargo +nightly fuzz run frames
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1"
libfuzzer-sys = "0.4"
thirtysftp = { path = "../crates/thirtysftp", default-features = false }
tokio = { version = "1", features = ["io-util", "rt"] }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frames"
path = "fuzz_targets/frames.rs"
test = false
doc = false
bench = false
