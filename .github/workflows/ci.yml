name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Keep in step with `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked

  features:
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Every feature at once.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      # The smallest build (protocol core only), then each feature alone.
      - run: cargo clippy -p thirtysftp --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test -p thirtysftp --no-default-features --locked
      - run: cargo test -p thirtysftp --no-default-features --features client --locked
      - run: cargo test -p thirtysftp --no-default-features --features server --locked
      - run: cargo test -p thirtysftp --no-default-features --features thirtyssh --locked
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  interop:
    name: OpenSSH interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenSSH
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server openssh-client
          # `sshd` refuses to start without its privilege separation directory.
          sudo mkdir -p /run/sshd
      - name: OpenSSH versions
        run: |
          {
            echo '### OpenSSH under test'
            echo '```'
            ssh -V 2>&1
            dpkg-query -W -f='openssh-server ${Version}' openssh-server; echo
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - run: cargo test --locked -p thirtysftp --test openssh -- --ignored

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
